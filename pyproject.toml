[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-work-exchange"
version = "0.1.0"
description = "Paper-FLOP job marketplace integrating Scout, Bench, Router, and Sentinel adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Greg Smith" }]
dependencies = [
    "cryptography>=42,<51",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pytest==8.4.2",
    "ruff==0.16.5",
    "types-PyYAML>=6.0,<7",
]
live = [
    # flop_sentinel is unpublished. Install from a local checkout, e.g.:
    #   pip install -e ~/dev/flop_sentinel
]

[project.scripts]
flop-work-exchange = "flop_work_exchange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flop_work_exchange = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["flop_work_exchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: optional tests that invoke local sibling agents (skipped by default)",
]
